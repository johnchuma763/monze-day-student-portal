<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password | Monze Day Secondary School</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f5fa;color:#17243b;font-family:Arial,sans-serif}
header{background:#102b50;color:white;padding:18px 7%;display:flex;align-items:center;gap:12px}
.logo{background:#d9ad45;color:#102b50;padding:12px;border-radius:8px;font-weight:bold}
.container{max-width:440px;margin:55px auto;padding:32px;background:white;border-radius:12px;box-shadow:0 5px 25px rgba(0,0,0,.08)}
h1{color:#102b50}
p{color:#68758a;line-height:1.5}
.notice{background:#fff8e7;border-left:4px solid #d9ad45;padding:12px;color:#66501e;font-size:14px}
label{display:block;font-weight:bold;margin:18px 0 8px}
input{width:100%;padding:13px;border:1px solid #ccd4df;border-radius:7px;font-size:15px}
button{width:100%;padding:14px;margin-top:24px;background:#102b50;color:white;border:0;border-radius:7px;font-size:16px;font-weight:bold}
button:disabled{opacity:.6}
#message{text-align:center;margin-top:16px}
footer{text-align:center;padding:20px;color:#68758a;font-size:13px}
@media(max-width:500px){.container{margin:30px 16px;padding:24px}}
</style>
</head>
<body>

<header>
<div class="logo">MD</div>
<h3>MONZE DAY SECONDARY SCHOOL</h3>
</header>

<div class="container">
<h1>Change Your Password</h1>

<div class="notice">
For your account security, you must replace the temporary password before accessing your student dashboard.
</div>

<form id="passwordForm">
<label for="currentPassword">Temporary Password</label>
<input type="password" id="currentPassword" required autocomplete="current-password">

<label for="newPassword">New Password</label>
<input type="password" id="newPassword" minlength="8" required autocomplete="new-password">

<label for="confirmPassword">Confirm New Password</label>
<input type="password" id="confirmPassword" minlength="8" required autocomplete="new-password">

<button type="submit" id="submitButton">Change Password</button>
</form>

<p id="message"></p>
</div>

<footer>© Monze Day Secondary School · Student Portal</footer>

<script>
async function checkLogin(){
    try {
        const response = await fetch("/api/student/me");
        if (response.status === 401) {
            window.location.href = "student-login.html";
        } else if (response.ok || response.status === 403) {
            // Stay on this page for voluntary or required password changes.
        } else {
            window.location.href = "student-login.html";
        }
    } catch(error) {
        message.textContent = "Unable to verify your account.";
    }
}
checkLogin();

document.getElementById("passwordForm").addEventListener("submit",async function(event){
    event.preventDefault();

    const message=document.getElementById("message");
    const button=document.getElementById("submitButton");

    const currentPassword=document.getElementById("currentPassword").value;
    const newPassword=document.getElementById("newPassword").value;
    const confirmPassword=document.getElementById("confirmPassword").value;

    if(newPassword!==confirmPassword){
        message.style.color="red";
        message.textContent="The new passwords do not match.";
        return;
    }

    if(newPassword.length<8){
        message.style.color="red";
        message.textContent="Your new password must have at least 8 characters.";
        return;
    }

    button.disabled=true;
    message.style.color="#a16f00";
    message.textContent="Updating your password...";

    try{
        const response=await fetch("/api/student/change-password",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({currentPassword,newPassword})
        });

        const result=await response.json();

        if(!response.ok){
            throw new Error(result.message||"Unable to change password.");
        }

        message.style.color="green";
        message.textContent="Password changed successfully. Opening your dashboard...";

        setTimeout(()=>{
            window.location.href="student-dashboard.html";
        },1000);

    }catch(error){
        message.style.color="red";
        message.textContent=error.message;
    }finally{
        button.disabled=false;
    }
});
</script>
</body>
</html>
