<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | Monze Day Secondary School</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f6fb;
    color: #24344d;
}

header {
    background: #102b50;
    color: white;
    padding: 20px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

header h2 {
    margin: 0;
}

nav {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: 600;
}

nav a:hover, nav a.active {
    color: #e2bd61;
}

.container {
    max-width: 900px;
    margin: 35px auto;
    padding: 0 18px;
}

.heading {
    margin-bottom: 25px;
}

.heading h1 {
    color: #102b50;
    margin-bottom: 8px;
}

.card {
    background: white;
    padding: 28px;
    border-radius: 15px;
    margin-bottom: 22px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 5px 18px rgba(16,43,80,.06);
}

.card h3 {
    color: #102b50;
    margin-top: 0;
}

#teacherPhoto {
    width: 135px;
    height: 135px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #c49a35;
    background: #edf1f6;
    display: block;
    margin-bottom: 18px;
}

input[type="file"] {
    display: block;
    margin: 15px 0;
    max-width: 100%;
}

button {
    background: #102b50;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #c49a35;
}

.info {
    line-height: 2;
    white-space: pre-line;
}

.message {
    font-weight: bold;
    margin-top: 12px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #64748b;
}

@media(max-width:600px) {
    header {
        padding: 18px;
    }

    nav {
        gap: 12px;
    }

    .card {
        padding: 20px;
    }
}

/* PROFESSIONAL PORTAL LINK DESIGN */
a {
    transition: background .2s ease, color .2s ease,
                box-shadow .2s ease, transform .2s ease;
}

a:focus-visible {
    outline: 3px solid #d9ad52;
    outline-offset: 3px;
}

/* Navigation links */
nav a {
    display: inline-flex;
    align-items: center;
    padding: 10px 13px;
    border-radius: 8px;
    text-decoration: none;
}

nav a:hover {
    background: rgba(217, 173, 82, .16);
    text-decoration: none;
}

nav a.active {
    font-weight: 700;
}

/* Dashboard and card links */
.card a,
.cards .card a,
.sidebar .card a,
.announcement-button,
.back {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 16px;
    border-radius: 8px;
    background: #102b50;
    color: #ffffff !important;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid #102b50;
    box-shadow: 0 3px 8px rgba(16, 43, 80, .12);
}

.card a:hover,
.cards .card a:hover,
.announcement-button:hover,
.back:hover {
    background: #1b4778;
    border-color: #1b4778;
    color: #ffffff !important;
    transform: translateY(-1px);
    box-shadow: 0 5px 12px rgba(16, 43, 80, .18);
}

/* Back button inside the student results header */
header .back {
    background: #d9ad52;
    color: #102b50 !important;
    border-color: #d9ad52;
}

header .back:hover {
    background: #edc875;
    color: #102b50 !important;
}

/* Teacher sidebar */
.sidebar a {
    transition: background .2s ease, color .2s ease;
}

/* Mobile-friendly navigation */
@media (max-width: 600px) {
    nav {
        gap: 8px;
    }

    nav a {
        padding: 9px 11px;
        font-size: 13px;
    }

    .card a,
    .back,
    .announcement-button {
        min-height: 42px;
    }
}

</style>
</head>

<body>

<header>
    <h2>MONZE DAY | TEACHER PORTAL</h2>

    <nav>
        <a href="teacher-dashboard.html">Home</a>
        <a href="teacher-profile.html" class="active">My Profile</a>
        <a href="teacher-settings.html">Settings</a>
    </nav>
</header>

<main class="container">

    <div class="heading">
        <h1>My Profile</h1>
        <p>View your personal and teaching information.</p>
    </div>

    <section class="card">
        <h3>Profile Photograph</h3>

        <img id="teacherPhoto" src="" alt="Teacher profile photo">

        <input
            type="file"
            id="photoFile"
            accept="image/png,image/jpeg,image/webp"
        >

        <button onclick="uploadPhoto()">Upload Photo</button>

        <p id="photoMessage" class="message"></p>
    </section>

    <section class="card">
        <h3>Teacher Information</h3>
        <div id="profileInfo" class="info">
            Loading teacher information...
        </div>
    </section>

</main>

<footer>
    © Monze Day Secondary School · Teacher Portal
</footer>

<script>
async function loadProfile() {
    try {
        const response = await fetch("/api/teacher/me");
        const teacher = await response.json();

        if (response.status === 401) {
            window.location.href = "teacher-login.html";
            return;
        }

        if (!response.ok) {
            throw new Error(teacher.message || "Unable to load profile.");
        }

        document.getElementById("profileInfo").textContent = [
            "Full Name: " + (teacher.full_name || "Not provided"),
            "Email: " + (teacher.email || "Not provided"),
            "Subjects: " + (teacher.subjects || "Not provided"),
            "Classes: " + (teacher.classes || "Not provided"),
            "Class Teacher: " + (teacher.is_class_teacher ? "Yes" : "No"),
            "Assigned Class: " + (teacher.assigned_class || "Not assigned"),
            "Account Created: " + (
                teacher.created_at
                    ? new Date(teacher.created_at).toLocaleDateString()
                    : "Not available"
            )
        ].join("\n");

        if (teacher.photo_url) {
            document.getElementById("teacherPhoto").src =
                teacher.photo_url;
        }

    } catch (error) {
        document.getElementById("profileInfo").textContent = error.message;
    }
}

async function uploadPhoto() {
    const fileInput = document.getElementById("photoFile");
    const message = document.getElementById("photoMessage");

    if (!fileInput.files.length) {
        message.textContent = "Please select a photo first.";
        message.style.color = "red";
        return;
    }

    const formData = new FormData();
    formData.append("photo", fileInput.files[0]);

    try {
        const response = await fetch("/api/teacher/photo", {
            method: "POST",
            body: formData
        });

        const result = await response.json();

        if (response.status === 401) {
            window.location.href = "teacher-login.html";
            return;
        }

        if (!response.ok) {
            throw new Error(result.message || "Photo upload failed.");
        }

        document.getElementById("teacherPhoto").src =
            result.photo_url + "?t=" + Date.now();

        message.textContent = result.message;
        message.style.color = "green";
        fileInput.value = "";

    } catch (error) {
        message.textContent = error.message;
        message.style.color = "red";
    }
}

loadProfile();
</script>

</body>
</html>
