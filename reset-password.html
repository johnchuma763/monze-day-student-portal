<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password | Monze Day Secondary School</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#092b55,#1764a5);font-family:Arial,sans-serif;padding:20px}
.card{background:white;padding:30px;border-radius:14px;width:100%;max-width:420px;box-shadow:0 10px 35px #0003}
h2{color:#123d70;text-align:center}
p{color:#555;line-height:1.6;text-align:center}
input,button{width:100%;padding:13px;margin-top:14px;border-radius:7px;font-size:16px}
input{border:1px solid #ccc}
button{border:0;background:#145da0;color:white;font-weight:bold;cursor:pointer}
#message{text-align:center;margin-top:15px;line-height:1.5}
a{color:#145da0}
</style>
</head>
<body>
<div class="card">
<h2>Reset Your Password</h2>
<p>Choose a new password with at least 8 characters.</p>
<form id="resetForm">
<input type="password" id="password" placeholder="New password" minlength="8" maxlength="128" required>
<input type="password" id="confirm" placeholder="Confirm new password" minlength="8" maxlength="128" required>
<button type="submit">Reset Password</button>
</form>
<div id="message" role="status"></div>
<p><a href="student-login.html">Back to Student Login</a></p>
</div>
<script>
const token=new URLSearchParams(location.search).get("token")||"";
document.getElementById("resetForm").addEventListener("submit",async function(e){
 e.preventDefault();
 const message=document.getElementById("message");
 const password=document.getElementById("password").value;
 const confirm=document.getElementById("confirm").value;
 if(password!==confirm){message.textContent="The passwords do not match.";return;}
 if(!token){message.textContent="This reset link is invalid or missing.";return;}
 message.textContent="Please wait...";
 try{
  const response=await fetch("/api/student/reset-password",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({token,newPassword:password})
  });
  const result=await response.json();
  message.textContent=result.message||"Request completed.";
  if(response.ok){
   document.getElementById("resetForm").reset();
   setTimeout(()=>location.href="student-login.html",2500);
  }
 }catch(error){
  message.textContent="Unable to contact the server. Please try again.";
 }
});
</script>
</body>
</html>
